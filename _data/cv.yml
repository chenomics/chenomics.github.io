- title: Research Experience
  type: time_table
  contents:
    - title: Damon Runyon Postdoctoral Fellow
      institution: University of Washington, Institute for Protein Design
      year: 2022 - present
      description:
        - "Advisor: David Baker"
        - Built a high-throughput functional screening platform for de novo designed proteins.
        - Designed synthetic transcription activators for programmable gene regulation.
        - Designed sequence-specific DNA-binding proteins, yielding fully de novo designed transcription factors.
        - Designed allosterically regulated deaminases for conditional genomic footprinting of target proteins.
    - title: Graduate Research Assistant
      institution: University of Washington, Department of Genome Sciences
      year: 2016 - 2022
      description:
        - "Advisor: Jay Shendure"
        - Developed ENGRAM, a prime editing-based molecular recorder that writes transient cellular signalling into permanent, multiplexed DNA edits.
        - Developed Prime-del, a paired prime editing method for precise genomic deletions up to 10 kb.
        - Developed Lindel, a machine learning model that predicts CRISPR/Cas9 double-strand break repair outcomes.
    - title: Undergraduate Researcher
      institution: Peking University
      year: 2011 - 2013
      description:
        - "Advisors: Sunney X. Xie and Yujie Sun"
        - Built a STORM super-resolution microscope and the image analysis software for single molecule localization.
        - Applied super-resolution imaging to nuclear actin dynamics and gene regulation.

