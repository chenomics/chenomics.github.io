name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for git info

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3
        bundler-cache: true

    - name: Setup Node.js (if needed)
      uses: actions/setup-node@v4
      with:
        node-version: '18'
      if: hashFiles('package.json') != ''
        
    - name: Install Node dependencies (if needed)
      run: |
        if [ -f "package.json" ]; then
          npm ci
        fi
      if: hashFiles('package.json') != ''

    - name: Configure Jekyll
      run: |
        # Update baseurl for GitHub Pages
        sed -i 's/^baseurl:.*/baseurl: ""/' _config.yml
        
    - name: Build site
      run: |
        bundle install
        bundle exec jekyll build --verbose
      env:
        JEKYLL_ENV: production

    - name: Test built site
      run: |
        # Basic checks for the built site
        if [ ! -f "_site/index.html" ]; then
          echo "Error: index.html not found in _site"
          exit 1
        fi
        echo "✅ Site built successfully"
        ls -la _site/

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site
        force_orphan: true
        
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🚀 Site preview will be available after merge to main branch!'
          })
