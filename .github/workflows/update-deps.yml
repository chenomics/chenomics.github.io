name: Update Dependencies

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3
        bundler-cache: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Update Ruby dependencies
      run: |
        bundle update --conservative
        
    - name: Update Node dependencies
      run: |
        if [ -f "package.json" ]; then
          npm update
        fi

    - name: Check for security vulnerabilities
      run: |
        bundle audit check --update || true
        if [ -f "package.json" ]; then
          npm audit fix --audit-level=moderate || true
        fi

    - name: Test updated dependencies
      run: |
        bundle install
        bundle exec jekyll build --verbose
      env:
        JEKYLL_ENV: production

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: '🔄 Automated dependency updates'
        body: |
          ## Automated Dependency Updates
          
          This PR contains automated dependency updates:
          
          ### Ruby Gems
          - Updated Gemfile.lock with latest compatible versions
          
          ### Node Packages (if applicable)
          - Updated package-lock.json with latest compatible versions
          
          ### Security
          - Addressed any security vulnerabilities found during audit
          
          **Note**: Please review the changes and test locally before merging.
          
          Generated by: ${{ github.workflow }} workflow
        branch: automated-dependency-updates
        delete-branch: true
