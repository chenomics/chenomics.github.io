version: 2
updates:
  # Enable updates for Bundler (Ruby)
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    
  # Disable npm updates since we don't use Node.js
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "never"

  # Enable GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
